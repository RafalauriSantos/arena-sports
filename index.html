		<!-- Critical CSS inline para LCP -->
		<style>
			/* Preload principal */
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			html {
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}
			body {
				margin: 0;
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				background-color: #020205;
				color: #ffffff;
				overflow-x: hidden;
			}

			/* Skip link */
			.skip-to-main {
				position: absolute;
				top: -100px;
				left: 0;
				background: #10b981;
				color: #000;
				padding: 0.75rem 1.5rem;
				text-decoration: none;
				font-weight: bold;
				border-radius: 0 0 0.5rem 0;
				z-index: 9999;
				transition: top 0.2s;
			}
			.skip-to-main:focus {
				top: 0;
			}

			/* Screen reader only */
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border-width: 0;
			}
			.sr-only:focus {
				position: static;
				width: auto;
				height: auto;
				padding: 0.5rem 1rem;
				margin: 0;
				overflow: visible;
				clip: auto;
				white-space: normal;
				background-color: #10b981;
				color: #000;
				font-weight: bold;
				z-index: 9999;
			}
		</style>
