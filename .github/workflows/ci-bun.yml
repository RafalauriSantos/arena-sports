name: CI (Bun)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build with Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies (bun)
        run: bun install

      - name: Typecheck (bunx tsc)
        run: bunx tsc --noEmit

      - name: Build (production)
        run: bun run build

      - name: Smoke-check dist bundle contains Landing
        run: |
          echo "Checking dist assets for Landing chunk..."
          ls -R dist | grep -i Landing || (echo "Landing chunk not found" && exit 1)

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
